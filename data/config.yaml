# 중앙 BOK워치 설정
# 표기 '확인 필요'는 빌드 환경(네트워크 차단)에서 원문 대조를 못 한 값이다.

site:
  title: 중앙 BOK워치
  title_en: JoongAng BOK Watch
  # 접근 제한(Cloudflare Access 등)이 없는 배포면 true → 상단 '사내 보고용' 띠
  show_internal_banner: true
  timezone: Asia/Seoul

# ---------------------------------------------------------------- 금통위 일정
meetings:
  # 통화정책방향 결정 회의 (점도표는 config.dotplot_meetings 참조)
  "2026": ["2026-10-22", "2026-11-26"]
  # 2027년은 한은 공지 확인 후 입력. 비어 있으면 화면에 경고 배지.
  "2027": []
# 일정이 확정 입력된 마지막 날. 결제일+만기가 이 날을 넘는 상품은 확률 계산에 넣지 않는다.
# 2027년 첫 회의는 예년(1월 11~16일)처럼 1월 14일 이후라고 가정한 값 — 한은 공지로 확인 후 고친다.
schedule_known_through: "2027-01-13"

# 점도표(6개월 뒤 조건부 전망)를 공개하는 회의 월. 2026년 5월 도입 보도 기준(확인 필요)
