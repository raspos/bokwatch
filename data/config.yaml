# ---------------------------------------------------------------- ECOS
ecos:
  base_url: https://ecos.bok.or.kr/api
  key_env: ECOS_API_KEY
  base_rate: {stat: 722Y001, cycle: D, item_name: 한국은행 기준금리, item_code: null}
  market:
    stat: 817Y002
    cycle: D
    # item_code는 `python -m bokwatch.fetch_rates --resolve`가 StatisticItemList로 채운다.
    # 이름(match) 기준으로 찾으며, 직접 적은 코드는 쓰지 않는다.
    items:
      - {id: cd91,   label: CD 91일,      match: "CD(91일)",          tenor_days: 91,  item_code: null}
      - {id: msb91,  label: 통안증권 91일, match: "통안증권(91일)",    tenor_days: 91,  item_code: null}
      - {id: msb1y,  label: 통안증권 1년,  match: "통안증권(1년)",     tenor_days: 365, item_code: null}
      - {id: msb2y,  label: 통안증권 2년,  match: "통안증권(2년)",     tenor_days: 730, item_code: null}
      - {id: ktb1y,  label: 국고채 1년,    match: "국고채(1년)",       tenor_days: 365, item_code: null}
      - {id: ktb3y,  label: 국고채 3년,    match: "국고채(3년)",       tenor_days: 1095, item_code: null}
  # KOFR OIS (있으면 우선). ECOS에 없으면 data/manual/ois_YYYY-MM-DD.csv
  ois:
    stat: null
    items:
      - {id: ois3m, label: KOFR OIS 3M, tenor_days: 91}
      - {id: ois6m, label: KOFR OIS 6M, tenor_days: 182}
      - {id: ois9m, label: KOFR OIS 9M, tenor_days: 273}
      - {id: ois1y, label: KOFR OIS 1Y, tenor_days: 365}
  history_start: "2020-10-01"

# ---------------------------------------------------------------- 모델 가정
model:
  method: auto            # auto | min_hike | lsq
  # 확률 계산에 쓰는 상품(OIS가 있으면 OIS가 우선)
  use: [cd91]
  # 정상 스프레드: 기본은 '장기 동결 국면' y - r0 중앙값
  hold_windows:
    - ["2023-02-24", "2024-08-21"]   # 3.50% 장기 동결
  spread_override: {}     # 예) {cd91: 0.10}  (%p) — 있으면 추정값 대신 사용
  spread_fallback: {cd91: 0.10, msb91: 0.0, ois3m: 0.0, ois6m: 0.0, ois9m: 0.0, ois1y: 0.0}
  sensitivity_bp: [-5, 0, 5]
  levels: [2.75, 3.00, 3.25, 3.50, 3.75]

# ---------------------------------------------------------------- 연합뉴스 RSS
news:
  # 연합뉴스 RSS 안내: https://www.yna.co.kr/rss/index (빌드 환경에서 접속 불가 — 주소 확인 필요)
  feeds:
    - {name: 연합뉴스 전체, url: "https://www.yna.co.kr/rss/news.xml"}
    - {name: 연합뉴스 경제, url: "https://www.yna.co.kr/rss/economy.xml"}
  main_keyword: 신현송
  chips: [금통위, 기준금리, 한국은행, 한은 총재, 점도표, 소수의견, 의사록]
  keep_days: 90

# ---------------------------------------------------------------- 한국은행 홈페이지
bok:
  # 게시판 주소는 빌드 환경에서 접속 불가로 확인하지 못함 — 첫 Actions 실행 로그로 확인 필요
  boards:
    minutes:
      label: 금융통화위원회 의사록
      url: "https://www.bok.or.kr/portal/bbs/B0000245/list.do?menuNo=200761"
    statement:
      label: 통화정책방향
      url: "https://www.bok.or.kr/portal/bbs/B0000169/list.do?menuNo=200059"
    press:
      label: 총재 기자간담회
      url: "https://www.bok.or.kr/portal/bbs/B0000170/list.do?menuNo=200061"
  base: "https://www.bok.or.kr"
  # 의사록 공개: 회의 뒤 약 2주 뒤 화요일 (공지와 다르면 minutes_release_override 우선)
  minutes_release_offset_days: 12   # 회의일+12일 이후 첫 화요일
  minutes_release_override: {}

# ---------------------------------------------------------------- 매파·비둘기 사전 (보조점수, 참고용)
tone:
  hawkish:
    인상: 2
    추가 인상: 2
    긴축: 2
    상방 리스크: 1
    상회: 1
    물가 상승압력: 1
    금융불균형: 1
    가계부채 증가: 1
    환율 상승: 1
    경계: 1
    시기와 속도: 1
  dovish:
    인하: 2
    완화: 2
    하방 리스크: 1
    하방 위험: 1
    둔화: 1
    성장 부진: 1
    경기 회복 지원: 1
    물가 안정: 0.5
    신중: 1
  minutes_views:
    인상: ["인상할 필요", "인상하는 것이 바람직", "인상 견해", "인상이 적절", "추가 인상"]
    동결: ["동결하는 것이 바람직", "현 수준에서 유지", "유지하는 것이 바람직", "동결 견해"]
    인하: ["인하할 필요", "인하하는 것이 바람직", "인하 견해", "인하가 적절"]

# ---------------------------------------------------------------- 경제지표·이벤트 (fetch_events.py)
events:
  bls_cpi_url: "https://www.bls.gov/schedule/news_release/cpi.htm"
  bls_jobs_url: "https://www.bls.gov/schedule/news_release/empsit.htm"
  fomc_url: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"
  kr_cpi_ecos:
    stat: 901Y009            # 소비자물가지수(2020=100), 월
    items: {headline: 총지수, core: 농산물및석유류제외지수}
  lookahead_days: 45
  lookback_days: 30
  # 추이 차트 세로선에 표시할 종류
  chart_kinds: [bok, minutes, cpi, fomc]

# ---------------------------------------------------------------- 네이버 뉴스 (검색 API, fetch_naver.py)
naver:
  # https://developers.naver.com 애플리케이션 등록 → 검색 API. Secrets: NAVER_CLIENT_ID / NAVER_CLIENT_SECRET
  endpoint: "https://openapi.naver.com/v1/search/news.json"
  queries: [신현송, 한은 기준금리, 금통위 금리, 한국은행 금리인상, 한은 총재, 원달러 환율 한은, 가계부채 금리, 소비자물가 한은, 국고채 금리, 연준 금리]
  display: 100
  keep_days: 30

# ---------------------------------------------------------------- AI 정성 판단 (ai_judge.py)
ai:
  # Secrets: ANTHROPIC_API_KEY. 없으면 이 단계는 건너뛰고 직전 판단을 유지한다.
  model: claude-opus-5-5
  classify_effort: low       # 기사 태깅
  synth_effort: medium       # 종합 판단
  batch_size: 40
  max_new_per_run: 200       # 실행당 태깅 상한(비용 상한)
  window_hours: 72           # 종합 판단에 쓰는 기사 범위
  factors: [물가, 환율, 부동산·가계부채, 성장·경기, 미 연준·글로벌 금리, 금융안정·시장, 한은 커뮤니케이션, 정부·정치, 기타]
