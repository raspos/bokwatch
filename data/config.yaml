# ---------------------------------------------------------------- ECOS
ecos:
  base_url: https://ecos.bok.or.kr/api
  key_env: ECOS_API_KEY
  base_rate: {stat: 722Y001, cycle: D, item_name: 한국은행 기준금리, item_code: "0101000"}
  market:
    stat: 817Y002
    cycle: D
    # item_code는 `python -m bokwatch.fetch_rates --resolve`가 StatisticItemList로 채운다.
    # 이름(match) 기준으로 찾으며, 직접 적은 코드는 쓰지 않는다.
    items:
      - {id: cd91,   label: CD 91일,      match: "CD(91일)",          tenor_days: 91,  item_code: "010502000"}
      - {id: msb91,  label: 통안증권 91일, match: "통안증권(91일)",    tenor_days: 91,  item_code: "010400000"}
      - {id: msb1y,  label: 통안증권 1년,  match: "통안증권(1년)",     tenor_days: 365, item_code: "010400001"}
      - {id: msb2y,  label: 통안증권 2년,  match: "통안증권(2년)",     tenor_days: 730, item_code: "010400002"}
      - {id: ktb1y,  label: 국고채 1년,    match: "국고채(1년)",       tenor_days: 365, item_code: "010190000"}
      - {id: ktb3y,  label: 국고채 3년,    match: "국고채(3년)",       tenor_days: 1095, item_code: "010200000"}
      # KOFR 익일물 실제치: KOFR 선물 기준기간 중 지난 날 계산과 KOFR−기준금리 차이 추정에 쓴다(확률 직접 투입 아님)
      - {id: kofr,   label: KOFR 익일물,   match: "KOFR(공시RFR)",     tenor_days: 1,   item_code: "010901000"}
  # KOFR OIS (있으면 우선). ECOS에 없으면 data/manual/ois_YYYY-MM-DD.csv
  ois:
    stat: null
    items:
      - {id: ois3m, label: KOFR OIS 3M, tenor_days: 91}
      - {id: ois6m, label: KOFR OIS 6M, tenor_days: 182}
      - {id: ois9m, label: KOFR OIS 9M, tenor_days: 273}
      - {id: ois1y, label: KOFR OIS 1Y, tenor_days: 365}
  history_start: "2020-10-01"

# ---------------------------------------------------------------- 모델 가정
model:
  method: auto            # auto | min_hike | lsq
  # 확률 계산에 쓰는 상품(OIS가 있으면 OIS가 우선)
  use: [cd91]
  # 정상 스프레드: 기본은 '장기 동결 국면' y - r0 중앙값
  hold_windows:
    - ["2023-02-24", "2024-08-21"]   # 3.50% 장기 동결
  spread_override: {}     # 예) {cd91: 0.10}  (%p) — 있으면 추정값 대신 사용
  spread_fallback: {cd91: 0.10, msb91: 0.0, ois3m: 0.0, ois6m: 0.0, ois9m: 0.0, ois1y: 0.0}
  sensitivity_bp: [-5, 0, 5]
  # 기본값은 CD 91일 모형 추정치(2026-10-14 결정 B+C). KOFR 선물 모형과 CD·KOFR 혼합은 '실험값'으로 따로 표시·기록한다.
  # 근거(2022.4~2026.8 회의 36회, 2026-10-14 미래정보 제거 후 재산출: 정상 스프레드를 회의마다 당시 자료로만 추정)
  #   CD 21/36·Brier 0.603, KOFR 선물 20/36·0.663, 반반 혼합 22/36·0.412, 과거 결정 빈도 21/36·0.540, 항상 동결 23/36·0.722.
  #   금리 변경 13회 중 CD가 맞힌 것은 4회(인상 4/9, 인하 0/4). 처음 공개한 CD 27/36·0.461은 미래정보가 섞인 값이었다.
  #   순차 검증(24회): 혼합 13/24·Brier 0.545, CD 13/24·0.627, 항상 동결 18/24. 어느 쪽 우위도 확정할 수 없다.
  # 채택 기준(사전 고정): 2026-10-22 회의부터 날짜별 기록(prob_log.csv)의 회의 3영업일 전 값으로 순차 평가해,
  #   금통위 8회 동안 혼합(실험)의 평균 Brier가 CD보다 낮고 '항상 동결'보다도 낮을 때 기본값 교체를 검토한다.
  blend: {experimental_kofr_weight: 0.5}
  futures:
    spread_lookback_days: 60     # KOFR − 기준금리 정상 차이: 기준일 앞 60일 중앙값
    spread_fallback: 0.04        # 관측이 10일 미만일 때(%p)
    max_stale_days: 5            # 선물 가격이 이보다 오래되면 쓰지 않는다
  levels: [2.75, 3.00, 3.25, 3.50, 3.75]

# ---------------------------------------------------------------- 연합뉴스 RSS
news:
  # 연합뉴스 RSS 안내: https://www.yna.co.kr/rss/index. 2026-10-14 PC에서 두 피드 모두 200·각 120건 확인
  feeds:
    - {name: 연합뉴스 전체, url: "https://www.yna.co.kr/rss/news.xml"}
    - {name: 연합뉴스 경제, url: "https://www.yna.co.kr/rss/economy.xml"}
  main_keyword: 신현송
  chips: [금통위, 기준금리, 한국은행, 한은 총재, 점도표, 소수의견, 의사록]
  keep_days: 90
  # 기사 탭에 보여 줄 언론사(기사 주소의 호스트 기준). 계열 매체(조선비즈·한경 매거진 등)는 넣지 않는다. AI 판단 입력은 이 목록과 무관.
  press:
    www.yna.co.kr: 연합뉴스
    news.einfomax.co.kr: 연합인포맥스
    www.sedaily.com: 서울경제
    www.hankyung.com: 한국경제
    www.mk.co.kr: 매일경제
    www.joongang.co.kr: 중앙일보
    www.chosun.com: 조선일보
    www.donga.com: 동아일보

# ---------------------------------------------------------------- 한국은행 홈페이지
bok:
  # 2026-10-14 PC에서 접속 확인.
  # 1) 통화정책방향 결정회의 일정 및 자료(연도별): 회의일·결정문·기자간담회·의사록 PDF가 한 표에 있다.
  meetings_page:
    label: 통화정책방향 결정회의 일정 및 자료
    url: "https://www.bok.or.kr/portal/singl/crncyPolicyDrcMtg/listYear.do?mtgSe=A&menuNo=200755&pYear={year}"
  # 2) 금융통화위원회 의사록 목록(게시일). 목록 본문은 AJAX(listCont.do)로 온다. depth 값이 없으면 전체 뉴스가 섞인다.
  minutes_list:
    label: 금융통화위원회 의사록
    url: "https://www.bok.or.kr/portal/singl/newsData/listCont.do?pageIndex=1&targetDepth=4&menuNo=200789&syncMenuChekKey=1&depth2=200038&depth3=201154&depth4=200789&depth=201150"
  base: "https://www.bok.or.kr"
  # 의사록 공개: 회의일+14일 이후 첫 화요일.
  # 실측(한은 의사록 목록 게시일): 2025-10-23·11-27, 2026-01-15·02-26·04-10·05-28·07-16·08-27 회의 8건 모두 회의 18~19일 뒤 화요일.
  # 한은 공지와 다르면 minutes_release_override 우선.
  minutes_release_offset_days: 14
  minutes_release_override: {}
  # 의사록 PDF 키워드 분석은 최근 회의 몇 건까지만(첫 실행 때 과거 PDF를 모두 받지 않도록)
  views_max_meetings: 2

