# BOK워치 설정
# 표기 '확인 필요'는 원문 대조를 못 한 값이다. 2026-10-14 PC에서 한은 홈페이지와 대조한 항목은 주석에 출처를 적었다.

site:
  title: BOK워치
  title_en: BOK Watch
  # true면 상단에 "사내 보고용 · 외부 공유 금지" 띠. 2026-10-14 공개 배포(링크 아는 누구나 열람)로 결정해 끔
  show_internal_banner: false
  timezone: Asia/Seoul

# ---------------------------------------------------------------- 금통위 일정
meetings:
  # 통화정책방향 결정 회의 (점도표는 config.dotplot_meetings 참조)
  "2026": ["2026-10-22", "2026-11-26"]
  # 2027년은 한은 공지 확인 후 입력. 비어 있으면 화면에 경고 배지.
  "2027": []
# 일정이 확정 입력된 마지막 날. 결제일+만기가 이 날을 넘는 상품은 확률 계산에 넣지 않는다.
# 2027년 일정 미공지(2026-10-14 한은 연도별 회의 표 확인). 1월 회의가 최근 4년 중 가장 이른 1/11일 수 있으므로 확정 범위는 1/10까지. 공지 후 고친다.
schedule_known_through: "2027-01-10"
# 다음 해 일정 미공지 동안 CD 모형을 멈추지 않기 위한 가정 회의(2026-10-15 결정). 계산에만 쓰고 화면 회의 목록에는 넣지 않는다.
# 1월 회의는 최근 4년(1/11~1/16) 중 가장 이른 1/11로 둔다. 2월 회의는 최근 4년 2/22 이후라 2/21까지를 가정 일정 범위로 본다.
# 회의별 최고 확률(가능 범위 상단)은 다른 회의 날짜와 무관하다. 최저·점추정만 이 가정의 영향을 받는다. 일정 공지 후 지운다.
assumed_meetings: ["2027-01-11"]
assumed_known_through: "2027-02-21"

# 점도표(6개월 뒤 조건부 금리전망)를 공개하는 회의 월. 한은 공보 2026-08-14호 별첨 "제시주기는 경제전망 발표시(2, 5, 8, 11월, 연 4회)"로 확인
dotplot_months: [2, 5, 8, 11]

