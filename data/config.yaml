# ---------------------------------------------------------------- 경제지표·이벤트 (fetch_events.py)
events:
  bls_cpi_url: "https://www.bls.gov/schedule/news_release/cpi.htm"
  bls_jobs_url: "https://www.bls.gov/schedule/news_release/empsit.htm"
  # 일정표 페이지는 당일·지난 발표를 뺀다 → BLS 캘린더로 보강(2026-10-14 확인: 9월분 CPI 10/14 08:30 ET가 일정표에 없고 ics에만 있음)
  bls_ics_url: "https://www.bls.gov/schedule/news_release/bls.ics"
  fomc_url: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"
  # 한국 CPI(2020=100, 월). 근원은 한은 통방문 정의(식료품 및 에너지 제외).
  # 2026-10-14 ECOS 확인: 901Y009 '총지수'(0), 901Y010 '식료품 및 에너지제외 지수 3)'(DB). '농산물및석유류제외'는 901Y010(QB)에만 있다.
  kr_cpi_ecos:
    items:
      headline: {stat: 901Y009, match: 총지수}
      core: {stat: 901Y010, match: 식료품및에너지제외}
  lookahead_days: 45
  lookback_days: 30
  # 추이 차트 세로선에 표시할 종류
  chart_kinds: [bok, minutes, cpi, fomc]

# ---------------------------------------------------------------- 네이버 뉴스 (검색 API, fetch_naver.py)
naver:
  # NAVER API HUB(네이버클라우드). 2026-06-25 개발자센터에서 이관, 기존 방식은 2027-06-30 종료.
  # 키: console.ncloud.com → Services → Application Service → NAVER API HUB → Application 등록(검색 API 선택)의 Client ID·Secret.
  # Secrets/.env: NAVER_CLIENT_ID / NAVER_CLIENT_SECRET. 계정 IAM 키(ncp_iam_)는 쓰지 않는다.
  endpoint: "https://naverapihub.apigw.ntruss.com/search/v1/news"
  queries: [신현송, 한은 기준금리, 금통위 금리, 한국은행 금리인상, 한은 총재, 원달러 환율 한은, 가계부채 금리, 소비자물가 한은, 국고채 금리, 연준 금리, 미국 CPI, 미국 소비자물가]
  display: 100
  keep_days: 30

# ---------------------------------------------------------------- AI 정성 판단 (ai_judge.py)
ai:
  # OpenAI API(Chat Completions 구조화 출력). Secrets/.env: OPENAI_API_KEY. 키나 모델이 없으면 건너뛰고 직전 판단을 유지한다.
  # gpt-5.5 날짜 고정판(2026-10-14 결정). 별칭(gpt-5.5) 대신 고정판을 써서 같은 입력에 같은 모델이 돌게 한다.
  model: gpt-5.5-2026-04-23
  # reasoning_effort: 추론 모델일 때만 보낸다. 비추론 모델이면 null.
  classify_effort: low       # 기사 태깅
  synth_effort: medium       # 종합 판단
  batch_size: 40
  max_new_per_run: 800       # 실행당 태깅 상한(비용 상한). 하루 1회 실행이라 하루치 기사(약 600건)를 한 번에 태깅
  window_hours: 72           # 종합 판단에 쓰는 기사 범위
  factors: [물가, 환율, 부동산·가계부채, 성장·경기, 미 연준·글로벌 금리, 금융안정·시장, 한은 커뮤니케이션, 시장·기관 전망, 정부·정치, 기타]
