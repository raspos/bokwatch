# 매일 오전 — 시장금리·한은·뉴스·지표·AI 판단·확률 기록 (cron은 UTC)
# 주 실행: Cloudflare 크론(cron/worker.js)이 09:40·10:30 KST에 workflow_dispatch로 호출한다(skip_if_done=true).
# GitHub 예약 실행은 매일 4시간 넘게 늦어(14:20 KST 전후 시작, 2026-10-15~23 확인) 보조로만 둔다. 오늘 기록이 있으면 건너뛴다.
# 날짜별 확률 기록은 그날 처음 '산출'된 값을 고정하므로 두 번째 실행이 기록을 덮어쓰지 않는다.
name: daily
on:
  schedule:
    - cron: "43 0 * * *"
    - cron: "13 1 * * *"
  workflow_dispatch:
    inputs:
      skip_if_done:
        description: "오늘 정기 기록이 이미 있으면 건너뜀(Cloudflare 크론이 true로 호출). 수동 실행은 기본 false"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 전체 갱신(단계별 실패는 건너뛰고 직전 값 유지)
        env:
          # 예약 실행·Cloudflare 크론 호출(skip_if_done=true)은 오늘 기록이 이미 있으면 건너뜀. 손으로 시작한 실행은 항상 돈다.
          SKIP_IF_DONE_TODAY: ${{ (github.event_name == 'schedule' || inputs.skip_if_done) && '1' || '0' }}
        run: python run_daily.py
      - name: 커밋
        run: |
          git config user.name "bokwatch-bot"
          git config user.email "bokwatch-bot@users.noreply.github.com"
          git add -A data site
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "daily: $(date '+%Y-%m-%d %H:%M KST')"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((2**i)); done
  deploy:
    needs: update
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
