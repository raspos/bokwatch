# 평일 18:00 KST — 시장금리·확률·메모 (cron은 UTC)
name: daily
on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data-commit      # 세 워크플로가 같은 브랜치에 커밋하므로 직렬화
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 시장금리(ECOS) — 실패해도 직전 데이터로 빌드
        run: python -m bokwatch.fetch_rates || true
      - name: 경제지표 일정·실제치
        run: python -m bokwatch.fetch_events || true
      - name: 빌드
        run: python build.py
      - name: AI 정성 종합 판단 (하루 1회) — 실패해도 직전 판단 유지
        run: python -m bokwatch.ai_judge || true
      - name: 재빌드(메모에 정성 판단 반영)
        run: python build.py
      - name: 커밋
        run: |
          git config user.name "bokwatch-bot"
          git config user.email "bokwatch-bot@users.noreply.github.com"
          git add -A data site
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "daily: $(date '+%Y-%m-%d %H:%M KST')"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((2**i)); done
  deploy:
    needs: update
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
