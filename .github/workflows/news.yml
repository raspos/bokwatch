# 평일 07:00~22:00 KST 매 30분 — 연합뉴스 RSS
name: news
on:
  schedule:
    - cron: "0,30 22-23 * * 0-4"   # KST 07:00~08:30 (월~금)
    - cron: "0,30 0-12 * * 1-5"    # KST 09:00~21:30
    - cron: "0 13 * * 1-5"         # KST 22:00
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data-commit      # 세 워크플로가 같은 브랜치에 커밋하므로 직렬화
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: RSS — 실패해도 직전 데이터 유지
        run: python -m bokwatch.fetch_news || true
      - name: 네이버 뉴스 검색 API
        run: python -m bokwatch.fetch_naver || true
      - name: AI 기사 태깅·압력지수 (새 기사만)
        run: python -m bokwatch.ai_judge --no-synth || true
      - name: 빌드(기사만)
        run: python build.py --only news
      - name: 커밋
        run: |
          git config user.name "bokwatch-bot"
          git config user.email "bokwatch-bot@users.noreply.github.com"
          git add -A data site
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "news: $(date '+%Y-%m-%d %H:%M KST')"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((2**i)); done
  deploy:
    needs: update
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
