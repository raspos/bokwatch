# 재사용 배포 워크플로. 저장소 변수 DEPLOY_TARGET = pages | cloudflare
name: deploy
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "functions/**"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  pages:
    if: ${{ vars.DEPLOY_TARGET != 'cloudflare' }}
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
  cloudflare:
    if: ${{ vars.DEPLOY_TARGET == 'cloudflare' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Cloudflare Pages 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.114.0 pages deploy site --project-name "${{ vars.CF_PAGES_PROJECT || 'joongang-bokwatch' }}" --branch main
