# 재사용 배포 워크플로. 저장소 변수 DEPLOY_TARGET = pages | cloudflare
name: deploy
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "functions/**", ".github/workflows/_deploy.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  pages:
    if: ${{ vars.DEPLOY_TARGET != 'cloudflare' }}
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
  cloudflare:
    if: ${{ vars.DEPLOY_TARGET == 'cloudflare' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: 조회수 KV 준비(없으면 만들고 VIEWS로 연결)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          W="npx --yes wrangler@3.114.0"
          find_id() { $W kv namespace list 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((x['id'] for x in d if x['title']=='bokwatch-views'), ''))"; }
          ID=$(find_id || true)
          if [ -z "$ID" ]; then $W kv namespace create bokwatch-views; ID=$(find_id || true); fi
          if [ -n "$ID" ]; then
            python3 -c 'import sys; n, i = sys.argv[1], sys.argv[2]; open("wrangler.toml", "w").write(f"name = \"{n}\"\npages_build_output_dir = \"site\"\ncompatibility_date = \"2024-09-01\"\n\n[[kv_namespaces]]\nbinding = \"VIEWS\"\nid = \"{i}\"\n")' "${{ vars.CF_PAGES_PROJECT || 'joongang-bokwatch' }}" "$ID"
            echo "KV 연결: $ID"; cat wrangler.toml
          else
            echo "KV 준비 실패(토큰 권한 확인 필요) — 조회수 없이 배포"
          fi
      - name: Cloudflare Pages 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.114.0 pages deploy site --project-name "${{ vars.CF_PAGES_PROJECT || 'joongang-bokwatch' }}" --branch main
